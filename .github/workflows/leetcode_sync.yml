name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes every day at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it anytime with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install requests

      - name: Execute Sync
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          cat << 'EOF' > run_sync.py
          import os
          import requests
          import json

          # Target the public GraphQL engine directly (Bypasses Cloudflare login gates)
          graphql_url = "https://leetcode.com"
          
          query = """
          query userPublicProfile($username: String!) {
            matchedUser(username: $username) {
              submitStats {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
            }
            recentAcSubmissionList(username: $username, limit: 20) {
              id
              title
              titleSlug
              timestamp
              lang
            }
          }
          """
          
          username = os.environ['LEETCODE_USERNAME']
          variables = {"username": username}
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Content-Type': 'application/json',
              'Referer': f'https://leetcode.com/{username}/'
          }
          
          print(f"Fetching public profile data for user: {username}")
          response = requests.post(graphql_url, json={'query': query, 'variables': variables}, headers=headers)
          
          if response.status_code != 200:
              print(f"Failed to communicate with LeetCode. Status: {response.status_code}")
              exit(1)
              
          data = response.json().get('data', {})
          if not data or not data.get('recentAcSubmissionList'):
              print("No recent accepted submissions found or profile is entirely private.")
              exit(0)
              
          submissions = data['recentAcSubmissionList']
          
          # Process files locally into the workspace layout
          os.makedirs('submissions', exist_ok=True)
          for sub in submissions:
              folder = f"submissions/{sub['titleSlug']}"
              os.makedirs(folder, exist_ok=True)
              
              # Map language names to file extensions
              lang_lower = sub['lang'].lower()
              ext = "py" if "python" in lang_lower else "cpp" if "cpp" in lang_lower else "js" if "javascript" in lang_lower else "java" if "java" in lang_lower else "txt"
              
              # Generate the tracking blueprint
              file_path = f"{folder}/solution.{ext}"
              if not os.path.exists(file_path):
                  with open(file_path, "w") as f:
                      f.write(f"# Solution for {sub['title']}\n# Language: {sub['lang']}\n\n# Synced via automated cloud config.")
                  
                  with open(f"{folder}/README.md", "w") as f:
                      f.write(f"# {sub['title']}\n\n- **Language:** {sub['lang']}\n- **Submission ID:** {sub['id']}")
                      
          print(f"Successfully tracked {len(submissions)} recent public items.")
          EOF
          python run_sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/
          if git diff --staged --quiet; then
            echo "No new submissions to push."
          else
            git commit -m "Auto-sync newest LeetCode solutions"
            git push
          fi
