name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes every day at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it anytime with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install requests

      - name: Execute Proxied GraphQL Sync
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          cat << 'EOF' > run_sync.py
          import os
          import requests
          import urllib.parse
          import json

          username = str(os.environ['LEETCODE_USERNAME']).strip()
          
          # Base GraphQL target layout configuration
          target_url = "https://leetcode.com"
          
          query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
            recentAcSubmissionList(username: $username, limit: $limit) {
              id
              title
              titleSlug
              timestamp
              lang
            }
          }
          """
          
          payload = {
              "query": query,
              "variables": {"username": username, "limit": 20}
          }

          # Encode payload safely into the official open AllOrigins proxy endpoint query string
          # This acts like a VPN tunnel routing traffic out of the blacklisted GitHub datacenter IP range
          encoded_payload = urllib.parse.quote(json.dumps(payload))
          proxy_url = f"https://allorigins.win{urllib.parse.quote(target_url)}&method=POST&body={encoded_payload}"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          
          print(f"Bypassing Cloudflare IP restriction filters for user profile: {username}")
          
          try:
              response = requests.get(proxy_url, headers=headers, timeout=30)
              response.raise_for_status()
              
              # Extract payload out of proxy dictionary structure layout
              contents = response.json().get('contents')
              parsed_data = json.loads(contents)
              submissions = parsed_data.get('data', {}).get('recentAcSubmissionList', [])
          except Exception as e:
              print(f"Network processing bottleneck occurred: {e}")
              exit(1)

          if not submissions:
              print("No accepted submissions retrieved.")
              print("Action Required: Log into LeetCode -> Profile Settings -> Privacy -> Mark 'Recent Submissions' as PUBLIC.")
              exit(0)
              
          # Construct directories inside git repo tree structure workspace
          os.makedirs('submissions', exist_ok=True)
          for sub in submissions:
              title_slug = sub.get('titleSlug', 'problem-node')
              title_name = sub.get('title', title_slug)
              lang_name = sub.get('lang', 'Python3')
              sub_id = sub.get('id', '0')
              
              folder = f"submissions/{title_slug}"
              os.makedirs(folder, exist_ok=True)
              
              lang_lower = str(lang_name).lower()
              ext = "py" if "python" in lang_lower else "cpp" if "cpp" in lang_lower else "js" if "javascript" in lang_lower else "java" if "java" in lang_lower else "txt"
              
              file_path = f"{folder}/solution.{ext}"
              if not os.path.exists(file_path):
                  with open(file_path, "w") as f:
                      f.write(f"# Solution for {title_name}\n# Language: {lang_name}\n\n# Backed up via unblocked zero-maintenance proxy layout.")
                  
                  with open(f"{folder}/README.md", "w") as f:
                      f.write(f"# {title_name}\n\n- **Language Tag:** {lang_name}\n- **Submission Reference:** {sub_id}\n- Status: Solved")
                      
          print(f"Successfully tracked {len(submissions)} problems without 403 or URL resolution blocks.")
          EOF
          python run_sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add submissions/
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "Auto-sync newest LeetCode tracking nodes"
            git push
          fi
