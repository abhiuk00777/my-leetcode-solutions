name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes every day at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it anytime with one click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step A: Logs in automatically via a headless runner to fetch fresh cookies
      - name: Fetch Fresh LeetCode Cookies
        uses: vishrutkmr7/UpdateLCCookies@v1.1
        with:
          username: ${{ secrets.LEETCODE_USERNAME }}
          password: ${{ secrets.LEETCODE_PASSWORD }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step B: Uses those fresh cookies to instantly grab your code and push it
      - name: Sync LeetCode Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'submissions'
          verbose: true
