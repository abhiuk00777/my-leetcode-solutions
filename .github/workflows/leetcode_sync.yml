name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automatically runs daily at 4:00 AM UTC
  workflow_dispatch:     # Allows you to trigger manually with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync LeetCode Progress Natively
        # This automated engine logs in natively to download code blocks without browser add-ons
        uses: carlostias/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-username: ${{ secrets.LEETCODE_USERNAME }}
          leetcode-password: ${{ secrets.LEETCODE_PASSWORD }}
          destination-folder: 'submissions'
