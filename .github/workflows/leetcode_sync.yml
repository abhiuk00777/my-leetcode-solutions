name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Daily at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Trigger anytime with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Sync Submissions Natively
        env:
          USER: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          # Query an open API bridge to avoid data center IP blocks
          API_URL="https://vercel.app{USER}"
          
          echo "Connecting to api for user: ${USER}"
          
          # Use raw curl to grab the cleanly resolved public JSON block
          RESPONSE=$(curl -s -L --max-time 30 "$API_URL")
          
          # Quick verification check to ensure data returned cleanly
          if [[ -z "$RESPONSE" || "$RESPONSE" == *"Internal Server Error"* ]]; then
            echo "API server endpoint error or profile is private."
            exit 0
          fi
          
          # Native Bash string isolation engine to extract problem keys safely
          echo "$RESPONSE" | grep -o '"title":"[^"]*"' | cut -d'"' -f4 | while read -r problem_title; do
            if [[ -n "$problem_title" ]]; then
              # Sanitize problem text formatting to make clean local folder names
              clean_slug=$(echo "$problem_title" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:] ')
              clean_slug="${clean_slug// /-}"
              
              target_dir="submissions/${clean_slug}"
              mkdir -p "$target_dir"
              
              # Map structural tracking and documentation files
              if [ ! -f "${target_dir}/solution.py" ]; then
                echo "# Solution for ${problem_title}" > "${target_dir}/solution.py"
                
                echo -e "# ${problem_title}\n\n- **Status:** Solved\n- Tracked via zero-maintenance automated configuration workflow." > "${target_dir}/README.md"
                echo "Logged tracking template for: ${problem_title}"
              fi
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/
          if git diff --staged --quiet; then
            echo "No new updates found to commit."
          else
            git commit -m "Auto-sync newest LeetCode tracking nodes"
            git push
          fi
