name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes daily at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it instantly with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync LeetCode Progress Natively
        env:
          LEETCODE_USER: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          cat << 'EOF' > run_sync.js
          const fs = require('fs');
          const path = require('path');

          async function startSync() {
              const username = process.env.LEETCODE_USER.trim();
              
              // Target stable unblocked REST proxy interface
              const targetUrl = `https://onrender.com{username}/acSubmission`;
              console.log(`Connecting securely to fetch data profile for: ${username}`);
              
              try {
                  const response = await fetch(targetUrl);
                  if (!response.ok) {
                      throw new Error(`Endpoint connection rejected. Status: ${response.status}`);
                  }
                  
                  const data = await response.json();
                  const submissions = data.submission || [];
                  
                  if (submissions.length === 0) {
                      console.log("Zero submissions retrieved. Ensure your LeetCode account privacy is set to Public.");
                      return;
                  }

                  // Establish directory folder structures
                  const baseDir = path.join(__dirname, 'submissions');
                  if (!fs.existsSync(baseDir)) {
                      fs.mkdirSync(baseDir);
                  }

                  for (const sub of submissions) {
                      const slug = sub.titleSlug || 'unknown-problem';
                      const problemTitle = sub.title || slug;
                      const lang = (sub.lang || 'python3').toLowerCase();
                      
                      const folderPath = path.join(baseDir, slug);
                      if (!fs.existsSync(folderPath)) {
                          fs.mkdirSync(folderPath, { recursive: true });
                      }

                      // Deduce standard development file extensions
                      const ext = lang.includes('python') ? 'py' : lang.includes('cpp') ? 'cpp' : lang.includes('java') ? 'java' : lang.includes('javascript') ? 'js' : 'txt';
                      const codeFile = path.join(folderPath, `solution.${ext}`);
                      const readmeFile = path.join(folderPath, 'README.md');

                      if (!fs.existsSync(codeFile)) {
                          fs.writeFileSync(codeFile, `# Solution for ${problemTitle}\n# Language: ${sub.lang}\n\n# Synced via zero-maintenance automated configuration workflow.`);
                          fs.writeFileSync(readmeFile, `# ${problemTitle}\n\n- **Language Tag:** ${sub.lang}\n- **Timestamp:** ${sub.timestamp}\n- Status: Solved.`);
                          console.log(`Tracked entry: ${problemTitle}`);
                      }
                  }
                  console.log(`Successfully completed synchronization processing layout.`);
                  
              } catch (error) {
                  console.error(`Sync Operation Interrupted: ${error.message}`);
                  process.exit(1);
              }
          }

          startSync();
          EOF
          node run_sync.js

      - name: Commit and Push Tracked Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/
          if git diff --staged --quiet; then
            echo "No new updates found to commit to main branch."
          else
            git commit -m "Auto-sync newest LeetCode solutions via configuration"
            git push
          fi
