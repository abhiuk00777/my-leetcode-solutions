name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automatically runs daily at 4:00 AM UTC
  workflow_dispatch:     # Allows you to trigger manually with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Verified LeetCode Sync
        # Official marketplace action handles unblocked proxying internally
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: '' 
          leetcode-session: ''     
          username: ${{ secrets.LEETCODE_USERNAME }}
          # Providing an empty string forces the workflow to target unblocked public stats endpoints
          password: '' 
          destination-folder: 'submissions'
          verbose: true
