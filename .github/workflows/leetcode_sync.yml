name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes every day at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it anytime with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install requests

      - name: Execute Clean GraphQL Sync
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          cat << 'EOF' > run_sync.py
          import os
          import requests
          import json

          # Read and clean username variable safely
          username = str(os.environ['LEETCODE_USERNAME']).strip()
          
          # Target LeetCode's official production GraphQL gateway endpoint
          graphql_url = "https://leetcode.com"
          
          query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
            recentAcSubmissionList(username: $username, limit: $limit) {
              id
              title
              titleSlug
              timestamp
              lang
            }
          }
          """
          
          variables = {"username": username, "limit": 20}
          
          # Clean, precise web browser emulation headers
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Content-Type": "application/json",
              "Origin": "https://leetcode.com",
              "Referer": f"https://leetcode.com{username}/"
          }
          
          print(f"Connecting directly to LeetCode API for user: {username}")
          
          try:
              response = requests.post(graphql_url, json={'query': query, 'variables': variables}, headers=headers, timeout=20)
              response.raise_for_status()
              data = response.json()
          except Exception as e:
              print(f"API Connection Failure: {e}")
              exit(1)
              
          submissions = data.get('data', {}).get('recentAcSubmissionList', [])
          
          if not submissions:
              print("No recent accepted submission objects found.")
              print("Fix: Go to LeetCode profile settings -> Privacy -> Check 'Recent Submissions' box PUBLIC.")
              exit(0)
              
          # Map problem data points into code repository structure folders
          os.makedirs('submissions', exist_ok=True)
          for sub in submissions:
              title_slug = sub.get('titleSlug', 'unknown-problem')
              folder = f"submissions/{title_slug}"
              os.makedirs(folder, exist_ok=True)
              
              lang_lower = str(sub.get('lang', 'text')).lower()
              ext = "py" if "python" in lang_lower else "cpp" if "cpp" in lang_lower else "js" if "javascript" in lang_lower else "java" if "java" in lang_lower else "txt"
              
              file_path = f"{folder}/solution.{ext}"
              if not os.path.exists(file_path):
                  with open(file_path, "w") as f:
                      f.write(f"# Solution for {sub.get('title')}\n# Language: {sub.get('lang')}\n\n# Synced via zero-maintenance configuration engine.")
                  
                  with open(f"{folder}/README.md", "w") as f:
                      f.write(f"# {sub.get('title')}\n\n- **Language Tag:** {sub.get('lang')}\n- **Submission Reference ID:** {sub.get('id')}\n- Status: Solved and Validated.")
                      
          print(f"Successfully processed {len(submissions)} submission templates.")
          EOF
          python run_sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add submissions/
          if git diff --staged --quiet; then
            echo "No new updates found to commit."
          else
            git commit -m "Auto-sync newest LeetCode tracking entries"
            git push
          fi
