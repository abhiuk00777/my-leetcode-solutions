name: Sync LeetCode Submissions

on:
  schedule:
    - cron: '0 4 * * *' # Automated run: Executes daily at 4:00 AM UTC
  workflow_dispatch:     # Manual run: Allows you to trigger it instantly with one click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install requests

      - name: Fetch and Map Progress
        env:
          LEETCODE_USER: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          python -c "
          import os, requests

          username = os.environ['LEETCODE_USER'].strip()
          # Using the stable community stats endpoint
          url = f'https://herokuapp.com{username}'
          
          print(f'Querying reliable statistics engine for user: {username}')
          try:
              response = requests.get(url, timeout=30)
              if response.status_code == 200:
                  data = response.json()
                  
                  if data.get('status') == 'success':
                      # Fallback array initialization to test directory creations
                      # It parses your counts to ensure the profile is active
                      total_solved = data.get('totalSolved', 0)
                      print(f'Profile found! Total Solved Problems: {total_solved}')
                      
                      if total_solved > 0:
                          os.makedirs('submissions', exist_ok=True)
                          # Create a main tracker file detailing your current statistics layout
                          with open('submissions/STATS.md', 'w') as f:
                              f.write(f'# LeetCode Performance Profile: {username}\n\n')
                              f.write(f'- **Total Solved:** {total_solved}\n')
                              f.write(f'- **Easy:** {data.get(\"easySolved\")}\n')
                              f.write(f'- **Medium:** {data.get(\"mediumSolved\")}\n')
                              f.write(f'- **Hard:** {data.get(\"hardSolved\")}\n\n')
                              f.write('Synced via zero-maintenance automated configuration workflow.')
                          print('Main statistics metrics file written successfully.')
                  else:
                      print(f'API error message: {data.get(\"message\")}')
          except Exception as e:
              print(f'Data tracking stopped unexpectedly: {e}')
          "

      - name: Commit and Push Tracked Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          if [ -d "submissions" ]; then
            git add submissions/
            if git diff --staged --quiet; then
              echo "No new metric adjustments found to commit."
            else
              git commit -m "Auto-sync newest LeetCode tracking data matrices"
              git push
            fi
          else
            echo "No directory generation steps occurred."
          fi
